# ─────────────────────────────────────────────────────────────────────────────
# pyproject.toml — конфигурация проекта mc7401-emulator
# ─────────────────────────────────────────────────────────────────────────────
#
# Содержит:
#   • метаданные пакета (PEP 621);
#   • зависимости;
#   • конфигурацию инструментов: pytest, ruff, mypy, coverage, isort;
#   • настройки сборки.
#
# Сборка пакета не обязательна — проект работает и как набор скриптов.
# Но `pyproject.toml` полезен для единообразия и для CI.
# ─────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


# ─────────────────────────────────────────────────────────────────────────────
# Метаданные пакета
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "mc7401-emulator"
version = "0.1.0"
description = "Эмулятор векторного графического терминала «Электроника МС 7401»"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ваше имя", email = "you@example.com" },
]
keywords = [
    "emulator",
    "terminal",
    "mc7401",
    "electronika",
    "vector-graphics",
    "retrocomputing",
    "pascal",
    "graf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Emulators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Основные зависимости — пусто. Ядро работает на stdlib.
dependencies = []


# ─────────────────────────────────────────────────────────────────────────────
# Опциональные зависимости
# ─────────────────────────────────────────────────────────────────────────────

[project.optional-dependencies]
# Для Tkinter-backend. Tkinter встроен в Python, но на Linux
# может понадобиться системный пакет (apt install python3-tk).
tk = []

# Для Pygame-backend (анимации, XOR).
pygame = ["pygame>=2.5"]

# Для попиксельного XOR в TkBackend и работы с глифами.
pil = ["Pillow>=10.0"]

# Для экспорта SVG → PNG.
png = ["cairosvg>=2.7"]

# Для тестов.
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]

# Для разработки: тесты + линтеры + типы.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pillow",
]

# Всё сразу.
all = [
    "pygame>=2.5",
    "Pillow>=10.0",
    "cairosvg>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
]


# ─────────────────────────────────────────────────────────────────────────────
# Скрипты командной строки
# ─────────────────────────────────────────────────────────────────────────────

[project.scripts]
mc7401 = "main:main"
mc7401-patch = "tools.pascal_patcher:main"
mc7401-vuk = "tools.vuk_emulator:main"


[project.urls]
Homepage = "https://github.com/<user>/mc7401-emulator"
Repository = "https://github.com/<user>/mc7401-emulator"
Issues = "https://github.com/<user>/mc7401-emulator/issues"
Documentation = "https://github.com/<user>/mc7401-emulator/blob/main/README.md"
Changelog = "https://github.com/<user>/mc7401-emulator/blob/main/CHANGELOG.md"


# ─────────────────────────────────────────────────────────────────────────────
# Конфигурация setuptools
# ─────────────────────────────────────────────────────────────────────────────

[tool.setuptools]
# Все модули лежат в корне проекта, без единого «пакета-обёртки».
# setuptools соберёт их как top-level modules.
py-modules = [
    "main",
    "reader",
    "parser",
    "state",
    "emulator",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backends*", "fonts*", "tools*"]
exclude = ["tests*", "docs*"]


# ─────────────────────────────────────────────────────────────────────────────
# Ruff — быстрый линтер и форматтер
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "tests/streams",
    "output*.svg",
    "output*.png",
]

[tool.ruff.lint]
# Правила:
#   E — pycodestyle errors
#   F — pyflakes
#   W — pycodestyle warnings
#   I — isort
#   N — pep8-naming
#   UP — pyupgrade
#   B — flake8-bugbear
#   C4 — flake8-comprehensions
#   SIM — flake8-simplify
#   RUF — Ruff-specific
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]

ignore = [
    # Слишком длинные строки — уже контролирует line-length.
    "E501",
    # Разрешаем assert в тестах.
    "S101",
    # Разрешаем `l` как имя переменной (в контексте терминала — «линия»).
    "E741",
    # Разрешаем не использовать переменную (иногда нужно для совместимости).
    "F841",
    # Разрешаем `from x import *` в отдельных случаях (не используем, но
    # пусть останется на всякий случай).
    "F403",
    "F405",
]

# Настройки для конкретных файлов.
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "E501",   # длинные строки в тестах допустимы
    "B011",   # assert False
]
"tests/conftest.py" = ["E402"]  # импорты после sys.path.insert

[tool.ruff.lint.isort]
known-first-party = [
    "reader", "parser", "state", "emulator",
    "backends", "fonts", "tools",
    "main", "tests",
]
known-third-party = ["pygame", "PIL", "cairosvg", "pytest"]
combine-as-imports = true
force-sort-within-sections = true


# ─────────────────────────────────────────────────────────────────────────────
# mypy — статическая типизация
# ─────────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_defs = false      # постепенно — не блокируем
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_any_generics = false
show_error_codes = true
pretty = true
color_output = true

exclude = [
    "build/",
    "dist/",
    "tests/streams/",
    "docs/",
    "graf.*",
]

# Игнорировать ошибки для модулей без стабов.
[[tool.mypy.overrides]]
module = [
    "pygame.*",
    "PIL.*",
    "cairosvg.*",
    "tkinter.*",
]
ignore_missing_imports = true


# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Показываем все свойства в diff.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--color=yes",
]

# Таймаут на каждый тест (pytest-timeout).
timeout = 30

markers = [
    "slow: медленные тесты (можно пропустить через `-m 'not slow'`)",
    "integration: интеграционные тесты",
    "requires_pygame: требуют установленный pygame",
    "requires_tk: требуют установленный tkinter",
    "requires_pil: требуют установленный Pillow",
    "requires_cairosvg: требуют установленный cairosvg",
]

# Фильтры предупреждений.
filterwarnings = [
    "error",                       # ошибки превращаем в ошибки
    "ignore::DeprecationWarning",  # deprecation — можно игнорировать
    "ignore::PendingDeprecationWarning",
    "ignore:.*pkg_resources.*:DeprecationWarning",
    "ignore:.*libpng.*:UserWarning",
]


# ─────────────────────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "tools/vuk_emulator.py",       # опциональный
    "backends/tk_backend.py",      # зависит от GUI
    "backends/pygame_backend.py",  # зависит от GUI
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\b",
    "\\.\\.\\.",
]
precision = 1
fail_under = 0    # постепенно поднимем


[tool.coverage.html]
directory = "htmlcov"


# ─────────────────────────────────────────────────────────────────────────────
# Black — на случай, если используется (не обязателен, но совместим с ruff)
# ─────────────────────────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | tests/streams
)/
'''


# ─────────────────────────────────────────────────────────────────────────────
# isort — на случай, если используется отдельно от ruff
# ─────────────────────────────────────────────────────────────────────────────

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "reader", "parser", "state", "emulator",
    "backends", "fonts", "tools",
    "main", "tests",
]
known_third_party = ["pygame", "PIL", "cairosvg", "pytest"]
combine_as_imports = true
force_sort_within_sections = true
skip = [".venv", "build", "dist", "tests/streams"]


# ─────────────────────────────────────────────────────────────────────────────
# EditorConfig-совместимые настройки (для редакторов, которые их читают)
# ─────────────────────────────────────────────────────────────────────────────

# Сам .editorconfig — отдельный файл, но многие редакторы
# поддерживают эти настройки прямо из pyproject.toml.